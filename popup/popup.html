<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>FocusShield</title>
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Header with Brand & Settings Gear & Theme Switcher -->
    <header>
      <div class="brand">
        <img src="../icons/icon.svg" class="logo-img" alt="FocusShield Logo">
        <h2>FocusShield</h2>
      </div>
      <div class="header-actions">
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme">☀️</button>
        <button id="open-settings-btn" class="icon-btn" title="Open Dashboard Settings">⚙️</button>
      </div>
    </header>

    <!-- Protection Status & Pause Button -->
    <div class="status-card" id="status-card">
      <div class="status-info">
        <span class="status-dot active" id="status-dot"></span>
        <span id="status-text">Protection Active</span>
      </div>
      <button id="pause-btn" class="pause-btn">Pause</button>
    </div>

    <!-- Quick Add Site -->
    <div class="input-group">
      <input type="text" id="site-input" placeholder="Add site e.g. reddit.com">
      <button id="add-btn">Add</button>
    </div>

    <!-- Blocked Sites List -->
    <div class="list-section">
      <div class="list-header">
        <span>Blocked Websites</span>
        <span id="site-count" class="badge">0</span>
      </div>
      <ul id="site-list"></ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
