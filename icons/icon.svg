<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="knightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Centered Knight & Shield Emblem -->
  <g filter="url(#knightShadow)">
    <!-- Helmet Crest Top -->
    <path d="M256 40 L268 76 L256 90 L244 76 Z" fill="url(#armorGrad)"/>
    
    <!-- Helmet Dome -->
    <path d="M224 84 C224 56 288 56 288 84 C288 108 280 128 280 148 L232 148 C232 128 224 108 224 84 Z" fill="url(#armorGrad)"/>
    
    <!-- Helmet Visor Slit & Faceplate -->
    <path d="M216 120 L296 120 L288 168 L256 188 L224 168 Z" fill="url(#armorGrad)"/>
    <path d="M236 132 L276 132 L256 142 Z" fill="#ffffff" opacity="0.95"/>
    <line x1="256" y1="120" x2="256" y2="180" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Gorget (Neck guard) -->
    <path d="M212 176 C236 192 276 192 300 176 L312 196 C276 216 236 216 200 196 Z" fill="url(#armorGrad)"/>

    <!-- Pauldrons (Shoulders & Arm Plates) -->
    <!-- Left Shoulder -->
    <path d="M192 192 C148 196 108 232 96 272 L120 284 C132 252 164 224 196 216 Z" fill="url(#armorGrad)"/>
    <path d="M92 280 C84 316 88 344 104 368 L124 356 C112 336 108 312 116 288 Z" fill="url(#armorGrad)"/>
    <path d="M84 376 C104 420 144 444 180 448 L172 424 C144 416 116 396 104 368 Z" fill="url(#armorGrad)"/>

    <!-- Right Shoulder -->
    <path d="M320 192 C364 196 404 232 416 272 L392 284 C380 252 348 224 316 216 Z" fill="url(#armorGrad)"/>
    <path d="M420 280 C428 316 424 344 408 368 L388 356 C400 336 404 312 396 288 Z" fill="url(#armorGrad)"/>
    <path d="M428 376 C408 420 368 444 332 448 L340 424 C368 416 396 396 408 368 Z" fill="url(#armorGrad)"/>

    <!-- Main Central Shield -->
    <!-- Inner Shield Body Fill -->
    <path d="M256 200 L372 236 V332 C372 400 316 456 256 480 C196 456 140 400 140 332 V236 Z" fill="url(#shieldFill)"/>
    
    <!-- Outer Shield Border Rim -->
    <path d="M256 188 L384 228 V336 C384 412 324 472 256 496 C188 472 128 412 128 336 V228 Z
             M256 212 L152 244 V332 C152 392 200 444 256 466 C312 444 360 392 360 332 V244 Z" 
          fill="url(#armorGrad)"/>

    <!-- Inner Shield Core Accent -->
    <path d="M256 236 L336 264 V332 C336 376 300 416 256 436 C212 416 176 376 176 332 V264 Z" 
          fill="none" stroke="url(#armorGrad)" stroke-width="4" stroke-dasharray="6,4" opacity="0.6"/>
  </g>
</svg>
